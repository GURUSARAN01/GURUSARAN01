name: Update profile contribution graph

on:
  # Run automatically every day
  schedule:
    - cron: "17 6 * * *"

  # Allow manual runs from the GitHub Actions page
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Download contribution data
        run: python scripts/fetch_contributions.py

      - name: Generate contribution graph
        run: python scripts/render_heatmap_svg.py

      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/contributions.json
          git add assets/contribution-graph.svg

          if git diff --cached --quiet; then
            echo "No profile changes detected."
          else
            git commit -m "chore: update contribution graph"
            git push
          fi