<svg
    xmlns="http://www.w3.org/2000/svg"
    width="820"
    height="430"
    viewBox="0 0 820 430"
    role="img"
    aria-label="Gurusaran GitHub profile information"
>
    <defs>
        <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#0d1117" />
            <stop offset="100%" stop-color="#161b22" />
        </linearGradient>

        <filter id="shadow">
            <feDropShadow
                dx="0"
                dy="5"
                stdDeviation="8"
                flood-color="#000000"
                flood-opacity="0.35"
            />
        </filter>

        <style>
            .window-title {
                fill: #c9d1d9;
                font-family: Consolas, Monaco, "Courier New", monospace;
                font-size: 15px;
            }

            .command {
                fill: #58a6ff;
                font-family: Consolas, Monaco, "Courier New", monospace;
                font-size: 18px;
                font-weight: 700;
            }

            .label {
                fill: #7ee787;
                font-family: Consolas, Monaco, "Courier New", monospace;
                font-size: 15px;
                font-weight: 700;
            }

            .value {
                fill: #c9d1d9;
                font-family: Consolas, Monaco, "Courier New", monospace;
                font-size: 15px;
            }

            .cursor {
                fill: #7ee787;
                animation: blink 1s steps(2, start) infinite;
            }

            @keyframes blink {
                50% {
                    opacity: 0;
                }
            }
        </style>
    </defs>

    <rect
        x="10"
        y="10"
        width="800"
        height="410"
        rx="14"
        fill="url(#background)"
        stroke="#30363d"
        filter="url(#shadow)"
    />

    <!-- Terminal buttons -->
    <circle cx="38" cy="38" r="7" fill="#ff5f56" />
    <circle cx="60" cy="38" r="7" fill="#ffbd2e" />
    <circle cx="82" cy="38" r="7" fill="#27c93f" />

    <text x="110" y="44" class="window-title">
        gurusaran@github
    </text>

    <line
        x1="25"
        y1="62"
        x2="795"
        y2="62"
        stroke="#30363d"
    />

    <text x="40" y="94" class="command">
        $ whoami
    </text>

    
