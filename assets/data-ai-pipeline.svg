        </text>

        <text
            x="665"
            y="308"
            class="node-subtitle"
        >
            Propensity · Profit
        </text>
    </g>
    

    <text
        x="40"
        y="390"
        class="status"
    >
        $ pipeline_status: operational
        <tspan class="cursor">_</tspan>
    </text>

    <text
        x="40"
        y="412"
        class="description"
    >
        Python · SQL · Power BI · Machine Learning · FastAPI · Streamlit
    </text>
</svg>
