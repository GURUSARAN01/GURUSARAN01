<svg
    xmlns="http://www.w3.org/2000/svg"
    width="820"
    height="430"
    viewBox="0 0 820 430"
    role="img"
    aria-label="Animated Data and AI development pipeline"
>
    <defs>
        <linearGradient
            id="background-gradient"
            x1="0"
            y1="0"
            x2="1"
            y2="1"
        >
            <stop offset="0%" stop-color="#0d1117" />
            <stop offset="100%" stop-color="#161b22" />
        </linearGradient>

        <linearGradient
            id="header-gradient"
            x1="0"
            y1="0"
            x2="1"
            y2="0"
        >
            <stop offset="0%" stop-color="#58a6ff" />
            <stop offset="100%" stop-color="#7ee787" />
        </linearGradient>

        <filter id="soft-shadow">
            <feDropShadow
                dx="0"
                dy="4"
                stdDeviation="5"
                flood-color="#000000"
                flood-opacity="0.32"
            />
        </filter>

        <filter id="blue-glow">
            <feDropShadow
                dx="0"
                dy="0"
                stdDeviation="7"
                flood-color="#58a6ff"
                flood-opacity="0.75"
            />
        </filter>

        <filter id="green-glow">
            <feDropShadow
                dx="0"
                dy="0"
                stdDeviation="5"
                flood-color="#7ee787"
                flood-opacity="0.9"
            />
        </filter>

        <marker
            id="arrow"
            markerWidth="9"
            markerHeight="9"
            refX="8"
            refY="4.5"
            orient="auto"
        >
            <path
                d="M0,0 L9,4.5 L0,9 Z"
                fill="#484f58"
            />
        </marker>

        <path
            id="path-1"
            d="M220 141 H320"
        />

        <path
            id="path-2"
            d="M500 141 H600"
        />

        <path
            id="path-3"
            d="M690 177 V255"
        />

        <path
            id="path-4"
            d="M600 291 H500"
        />

        <path
            id="path-5"
            d="M320 291 H220"
        />

        <style>
            .outer-background {
                fill: url(#background-gradient);
                stroke: #30363d;
                stroke-width: 1.5;
            }

            .terminal-title {
                fill: #c9d1d9;
                font-family: Consolas, Monaco, "Courier New", monospace;
                font-size: 14px;
            }

            .main-title {
                fill: url(#header-gradient);
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                    Helvetica, Arial, sans-serif;
                font-size: 22px;
                font-weight: 700;
            }

            .description {
                fill: #8b949e;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                    Helvetica, Arial, sans-serif;
                font-size: 13px;
            }

            .node-background {
                fill: #161b22;
                stroke: #30363d;
                stroke-width: 1.5;
                filter: url(#soft-shadow);
            }

            .number-background {
                fill: #161b22;
                stroke: #30363d;
            }

            .node-number {
                fill: #f0f6fc;
                font-family: Consolas, Monaco, "Courier New", monospace;
                font-size: 12px;
                font-weight: 700;
            }

            .node-title {
                fill: #f0f6fc;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                    Helvetica, Arial, sans-serif;
                font-size: 15px;
                font-weight: 700;
            }

            .node-subtitle {
                fill: #8b949e;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                    Helvetica, Arial, sans-serif;
                font-size: 11px;
            }

            .connection {
                fill: none;
                stroke: #484f58;
                stroke-width: 3;
                stroke-linecap: round;
                marker-end: url(#arrow);
            }

            .moving-particle {
                fill: #7ee787;
                filter: url(#green-glow);
            }

            .status {
                fill: #7ee787;
                font-family: Consolas, Monaco, "Courier New", monospace;
                font-size: 13px;
            }

            .cursor {
                animation: blink 1s steps(2, start) infinite;
            }

            @keyframes blink {
                50% {
                    opacity: 0;
                }
            }
        </style>
    </defs>

    <rect
        x="1"
        y="1"
        width="818"
        height="428"
        rx="14"
        class="outer-background"
    />

    <!-- Terminal controls -->
    <circle cx="28" cy="26" r="7" fill="#ff5f56" />
    <circle cx="51" cy="26" r="7" fill="#ffbd2e" />
    <circle cx="74" cy="26" r="7" fill="#27c93f" />

    <text
        x="100"
        y="31"
        class="terminal-title"
    >
        gurusaran@github: ~/data-ai-pipeline
    </text>

    <line
        x1="18"
        y1="49"
        x2="802"
        y2="49"
        stroke="#30363d"
    />

    <text
        x="40"
        y="79"
        class="main-title"
    >
        Data to Decision Pipeline
    </text>

    <text
        x="40"
        y="98"
        class="description"
    >
        Building production-ready analytics and machine-learning products
    </text>

    <!-- Connection paths -->
    <path d="M220 141 H320" class="connection" />
    <path d="M500 141 H600" class="connection" />
    <path d="M690 177 V255" class="connection" />
    <path d="M600 291 H500" class="connection" />
    <path d="M320 291 H220" class="connection" />

    <!-- Moving data particles -->
    <circle r="5" class="moving-particle">
        <animateMotion
            dur="2.2s"
            begin="0s"
            repeatCount="indefinite"
        >
            <mpath href="#path-1" />
        </animateMotion>
    </circle>

    <circle r="5" class="moving-particle">
        <animateMotion
            dur="2.2s"
            begin="0.7s"
            repeatCount="indefinite"
        >
            <mpath href="#path-2" />
        </animateMotion>
    </circle>

    <circle r="5" class="moving-particle">
        <animateMotion
            dur="2.2s"
            begin="1.4s"
            repeatCount="indefinite"
        >
            <mpath href="#path-3" />
        </animateMotion>
    </circle>

    <circle r="5" class="moving-particle">
        <animateMotion
            dur="2.2s"
            begin="2.1s"
            repeatCount="indefinite"
        >
            <mpath href="#path-4" />
        </animateMotion>
    </circle>

    <circle r="5" class="moving-particle">
        <animateMotion
            dur="2.2s"
            begin="2.8s"
            repeatCount="indefinite"
        >
            <mpath href="#path-5" />
        </animateMotion>
    </circle>

    
    <g>
        <rect
            x="40"
            y="105"
            width="180"
            height="72"
            rx="12"
            class="node-background"
        >
            <animate
                attributeName="stroke"
                values="#30363d;#58a6ff;#30363d"
                dur="4s"
                begin="0.0s"
                repeatCount="indefinite"
            />

            <animate
                attributeName="filter"
                values="url(#soft-shadow);url(#blue-glow);url(#soft-shadow)"
                dur="4s"
                begin="0.0s"
                repeatCount="indefinite"
            />
        </rect>

        <circle
            cx="74"
            cy="141"
            r="19"
            class="number-background"
        >
            <animate
                attributeName="fill"
                values="#161b22;#1f6feb;#161b22"
                dur="4s"
                begin="0.0s"
                repeatCount="indefinite"
            />
        </circle>

        <text
            x="74"
            y="146"
            text-anchor="middle"
            class="node-number"
        >
            01
        </text>

        <text
            x="105"
            y="136"
            class="node-title"
        >
            Raw Data
        </text>

        <text
            x="105"
            y="158"
            class="node-subtitle"
        >
            SQL · APIs · Files
        </text>
    </g>
    

    <g>
        <rect
            x="320"
            y="105"
            width="180"
            height="72"
            rx="12"
            class="node-background"
        >
            <animate
                attributeName="stroke"
                values="#30363d;#58a6ff;#30363d"
                dur="4s"
                begin="0.6s"
                repeatCount="indefinite"
            />

            <animate
                attributeName="filter"
                values="url(#soft-shadow);url(#blue-glow);url(#soft-shadow)"
                dur="4s"
                begin="0.6s"
                repeatCount="indefinite"
            />
        </rect>

        <circle
            cx="354"
            cy="141"
            r="19"
            class="number-background"
        >
            <animate
                attributeName="fill"
                values="#161b22;#1f6feb;#161b22"
                dur="4s"
                begin="0.6s"
                repeatCount="indefinite"
            />
        </circle>

        <text
            x="354"
            y="146"
            text-anchor="middle"
            class="node-number"
        >
            02
        </text>

        <text
            x="385"
            y="136"
            class="node-title"
        >
            Data Cleaning
        </text>

        <text
            x="385"
            y="158"
            class="node-subtitle"
        >
            Pandas · Validation
        </text>
    </g>
    

    <g>
        <rect
            x="600"
            y="105"
            width="180"
            height="72"
            rx="12"
            class="node-background"
        >
            <animate
                attributeName="stroke"
                values="#30363d;#58a6ff;#30363d"
                dur="4s"
                begin="1.2s"
                repeatCount="indefinite"
            />

            <animate
                attributeName="filter"
                values="url(#soft-shadow);url(#blue-glow);url(#soft-shadow)"
                dur="4s"
                begin="1.2s"
                repeatCount="indefinite"
            />
        </rect>

        <circle
            cx="634"
            cy="141"
            r="19"
            class="number-background"
        >
            <animate
                attributeName="fill"
                values="#161b22;#1f6feb;#161b22"
                dur="4s"
                begin="1.2s"
                repeatCount="indefinite"
            />
        </circle>

        <text
            x="634"
            y="146"
            text-anchor="middle"
            class="node-number"
        >
            03
        </text>

        <text
            x="665"
            y="136"
            class="node-title"
        >
            Analytics
        </text>

        <text
            x="665"
            y="158"
            class="node-subtitle"
        >
            SQL · Power BI
        </text>
    </g>
    

    <g>
        <rect
            x="40"
            y="255"
            width="180"
            height="72"
            rx="12"
            class="node-background"
        >
            <animate
                attributeName="stroke"
                values="#30363d;#58a6ff;#30363d"
                dur="4s"
                begin="3.0s"
                repeatCount="indefinite"
            />

            <animate
                attributeName="filter"
                values="url(#soft-shadow);url(#blue-glow);url(#soft-shadow)"
                dur="4s"
                begin="3.0s"
                repeatCount="indefinite"
            />
        </rect>

        <circle
            cx="74"
            cy="291"
            r="19"
            class="number-background"
        >
            <animate
                attributeName="fill"
                values="#161b22;#1f6feb;#161b22"
                dur="4s"
                begin="3.0s"
                repeatCount="indefinite"
            />
        </circle>

        <text
            x="74"
            y="296"
            text-anchor="middle"
            class="node-number"
        >
            06
        </text>

        <text
            x="105"
            y="286"
            class="node-title"
        >
            Dashboard
        </text>

        <text
            x="105"
            y="308"
            class="node-subtitle"
        >
            Insights · Decisions
        </text>
    </g>
    

    <g>
        <rect
            x="320"
            y="255"
            width="180"
            height="72"
            rx="12"
            class="node-background"
        >
            <animate
                attributeName="stroke"
                values="#30363d;#58a6ff;#30363d"
                dur="4s"
                begin="2.4s"
                repeatCount="indefinite"
            />

            <animate
                attributeName="filter"
                values="url(#soft-shadow);url(#blue-glow);url(#soft-shadow)"
                dur="4s"
                begin="2.4s"
                repeatCount="indefinite"
            />
        </rect>

        <circle
            cx="354"
            cy="291"
            r="19"
            class="number-background"
        >
            <animate
                attributeName="fill"
                values="#161b22;#1f6feb;#161b22"
                dur="4s"
                begin="2.4s"
                repeatCount="indefinite"
            />
        </circle>

        <text
            x="354"
            y="296"
            text-anchor="middle"
            class="node-number"
        >
            05
        </text>

        <text
            x="385"
            y="286"
            class="node-title"
        >
            FastAPI
        </text>

        <text
            x="385"
            y="308"
            class="node-subtitle"
        >
            Prediction Service
        </text>
    </g>
    

    <g>
        <rect
            x="600"
            y="255"
            width="180"
            height="72"
            rx="12"
            class="node-background"
        >
            <animate
                attributeName="stroke"
                values="#30363d;#58a6ff;#30363d"
                dur="4s"
                begin="1.8s"
                repeatCount="indefinite"
            />

            <animate
                attributeName="filter"
                values="url(#soft-shadow);url(#blue-glow);url(#soft-shadow)"
                dur="4s"
                begin="1.8s"
                repeatCount="indefinite"
            />
        </rect>

        <circle
            cx="634"
            cy="291"
            r="19"
            class="number-background"
        >
            <animate
                attributeName="fill"
                values="#161b22;#1f6feb;#161b22"
                dur="4s"
